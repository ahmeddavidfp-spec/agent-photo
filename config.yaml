# --- Style et Ton de l'IA (legacy, conservé pour rétro-compat) ---
ai_tone: >
  Agis en photographe pro et curateur. Ton cinématographique, mélancolique, épuré.
  Analyse : lignes de fuite, dualité, anachronisme, contraste architecture/sujet.
  Style : phrases courtes, rythme sec, vocabulaire riche.

# --- Identité de l'auteur ---
photographer_bio: |
  David Ahmed, photographe de rue (Belgique).
  Travail en noir et blanc sur l'instant suspendu, la tension et le silence.
  Esthétique 'film noir'.

# --- Hashtags globaux (fallback si pas de hashtags par galerie) ---
hashtags: "#streetphotography #spicollective #street_perfection #burnmyeye #hcsc_street #streetdreamsmag #life_is_street #zonestreet #bnw_demand #streetphotographer #storyofthestreet #raw_street #leicaphotography #documentaryphotography #davidahmed #leica #bnw"

# --- Exemples de voix (pass 2) -----------------------------------------------
# Remplace ces 3 exemples par TES meilleures captions existantes (copier-coller).
# L'IA s'en sert pour calibrer le rythme et le vocabulaire — elle ne les copie pas.
voice_examples: |
  ---
  Empty benches, full sky.
  Bruxelles, 7:14 AM. The rain had just stopped and the cafés were still asleep.
  What's the last moment of silence you stole from a city?

  Bancs vides, ciel plein.
  Bruxelles, 7h14. La pluie venait de s'arrêter, les cafés dormaient encore.
  Tu te souviens de ton dernier instant de silence volé à une ville ?
  ---
  He didn't see me.
  Tokyo, under the Yamanote line. Hat, cigarette, and a shadow longer than the man.
  Do you still believe in portraits made without permission?

  Il ne m'a pas vu.
  Tokyo, sous la Yamanote. Chapeau, cigarette, une ombre plus longue que lui.
  Crois-tu encore aux portraits volés ?
  ---
  Concrete prayer.
  Casablanca. A woman walks past the mosque — her scarf catches the only warm light left on the wall.
  Where does your city hold its quiet ?

  Prière de béton.
  Casablanca. Une femme passe devant la mosquée — son foulard capte la dernière lumière chaude du mur.
  Où ta ville range-t-elle son silence ?

