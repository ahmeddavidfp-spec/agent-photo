# --- Exemples de voix (pass 2) -----------------------------------------------
# Vraies captions IG de @davidmertens.me. L'IA s'en sert pour calibrer le
# RYTHME et la STRUCTURE (hook court / story / question / hashtags), pas le
# contenu. Séparateur entre exemples : ligne avec "---".
voice_examples: |
  ---
  The door was open. Nobody went in.
  Three seconds of nothing. That's the photo. 📍 Bruxelles

  La porte était ouverte. Personne n'est entré.
  Trois secondes de rien. C'est ça, la photo. 📍 Bruxelles

  Série complète 👇
  davidmertens.me/bruxelles
  #streetphotography #bnw #leicaphotography
  ---
  She crossed the frame in two seconds. I had one.
  The light was ready. 📍 New York

  Elle a traversé le cadre en deux secondes. J'en avais une.
  La lumière, elle, était prête. 📍 New York

  Série complète 👇
  davidmertens.me/new-york
  #nycstreet #streetphotography #bnw_nyc
  ---
  Sunday in Milano. Nobody hurries. Somebody always does.
  The contrast lives in the detail — linen, shadow, pace. 📍 Milano

  Dimanche à Milano. Personne ne se presse. Quelqu'un le fait toujours.
  Le contraste vit dans les détails — lin, ombre, allure. 📍 Milano

  Série complète 👇
  davidmertens.me/milan
  #milan #streetphotography #bnw
  ---
  Tokyo doesn't explain itself.
  You either read it fast or you miss it. 📍 Tokyo

  Tokyo ne s'explique pas.
  Tu la lis vite ou tu la rates. 📍 Tokyo

  Série complète 👇
  davidmertens.me/tokyo
  #tokyostreet #streetphotography #bnw_tokyo

# --- Contexte curatorial par galerie (pass 2) --------------------------------
# Texte long décrivant TA vision artistique de la ville. Injecté dans Pass 2
# UNIQUEMENT si la galerie courante est présente — l'IA l'utilise pour capter
# le mood/thème, sans le copier. Laisse vide ou omets une galerie pour utiliser
# uniquement voice_examples.
gallery_context:
  new-york: |
    New York est un assaut permanent sur les sens. C'est la ville de la photographie
    de rue par excellence, celle où chaque angle est une icône potentielle. Pour
    cette série, j'ai dû filtrer ce trop-plein pour trouver mon propre chemin à
    travers la verticalité écrasante et le bruit incessant. C'est un travail sur
    l'énergie pure.
    À Manhattan, la lumière descend comme une lame entre les gratte-ciels, créant
    des contrastes d'une violence magnifique. J'ai utilisé ces puits de clarté
    pour isoler des individus au milieu de la foule anonyme. Photographier New York,
    c'est traquer ces instants de solitude absolue au cœur du chaos le plus total.
    Rien n'est jamais figé ici. Les taxis jaunes, les vapeurs de métro et les flux
    de piétons créent une chorégraphie nerveuse. Mes images tentent de restituer
    cette vitesse, tout en cherchant des points de fixation : un regard, une main
    posée sur un journal, un visage éclairé par un reflet. C'est une quête de
    l'humain dans la démesure.

  tokyo: |
    Je n'ai pas photographié Tokyo, c'est elle qui m'a traversé. Je suis arrivé
    avec mes repères et ils ont disparu. Rien ici ne se donne comme ailleurs :
    tout est fluide, précis et discret. Pourtant, Tokyo déborde de formes et de
    tensions douces. C'est une ville qui demande un respect immense du cadre et
    du silence.
    Dans cette ville, il n'y a pas de cri, mais une intensité rare. Chaque
    mouvement semble pensé, chaque espace est habité avec une retenue fascinante.
    J'ai photographié avec curiosité et gratitude, cherchant à traduire mon
    propre vertige face à une organisation urbaine que je ne comprenais pas,
    mais que je sentais profondément vivante.
    Tokyo est faite de contrastes invisibles. Rien ne déborde, et pourtant tout
    est en mouvement perpétuel. Dans mes photos, on trouve cette tension : des
    corps isolés dans la foule, des reflets fragmentés et des gestes calmes au
    cœur du tumulte.

  milan: |
    Milan est une ville de mouvement et d'allure. Tout y semble habité par une
    forme d'élégance naturelle, des façades majestueuses aux passants pressés.
    J'ai voulu saisir cette énergie particulière, ce mélange de tradition
    bourgeoise et de modernité nerveuse qui définit l'identité milanaise. Ici,
    la rue est une scène permanente.
    Dans les galeries couvertes comme dans les quartiers plus populaires, le
    regard est sans cesse sollicité par des contrastes visuels forts. J'ai
    photographié la lumière qui tombe à pic sur les pavés, les silhouettes qui
    se découpent avec précision et l'esthétique soignée de chaque coin de rue.
    Milan réussit à faire cohabiter le faste et l'austérité. Mes images
    explorent cette dualité : la verticalité des gratte-ciels de Porta Nuova
    face à la pierre grise des vieux palais.

  bruxelles: |
    Bruxelles est une ville qui résiste à la carte postale. Trop plate pour être
    dramatique, trop grise pour être solaire, elle n'offre rien aux photographes
    pressés. C'est précisément là sa force : elle force la patience.
    J'y suis né et j'y reviens toujours un peu étranger. La beauté y est oblique —
    une façade art déco moisie, un marché qui sent la frite et le pavé mouillé,
    un enfant qui court dans un couloir de lumière qui n'existe que deux fois par an.
    Bruxelles ne se donne pas. Elle se mérite. Dans cette série, je cherche à
    photographier la ville comme on regarde un vieil ami : sans illusion, mais avec
    affection. C'est ma ville et ce n'est pas la mienne.

  barcelone: |
    Barcelone est lumineuse et ça complique tout. Dans une ville pareille, la lumière
    est un personnage à part entière — elle sculpte la pierre, brûle les ombres,
    révèle ce que les autres villes cachent. J'ai dû apprendre à ne pas me laisser
    séduire par le spectacle.
    Ce qui m'intéresse à Barcelone, c'est ce qui résiste à la mise en scène : les
    gens qui vivent là, pas ceux qui visitent. Les gestes ordinaires sur fond de
    Gaudí. L'ennui majestueux d'un dimanche après-midi. L'architecture qui déborde
    de partout mais les corps qui continuent leur trajet sans lever la tête.
    C'est une ville faite pour les photographes de rue parce qu'elle offre trop —
    et qu'il faut avoir le courage de refuser ce trop.

  berlin: |
    Berlin est une ville de fantômes. Pas les fantômes kitsch des guides touristiques,
    mais les vrais — ceux qui habitent les espaces vides, les lots non construits,
    les immeubles qui ont survécu à trop de régimes pour avoir un seul style.
    Ce qui fascine dans Berlin, c'est la cohabitation impossible entre le poids de
    l'histoire et l'insouciance bruyante de la ville actuelle. Les berlinois ont
    appris à ne pas regarder en arrière, et cette résolution forcée crée une tension
    photographique permanente.
    J'ai photographié Berlin en cherchant les points de friction : là où le béton
    rencontre le street art, là où la brutalité des formes rencontre la douceur des
    corps qui se déplacent dessous. Berlin ne demande pas à être aimée. Elle demande
    à être regardée.

  casablanca: |
    Casablanca n'est pas la ville du film. C'est mieux que ça — et plus difficile.
    Une mégapole nord-africaine contemporaine qui ne ressemble à aucune autre : ni
    arabe, ni française, ni africaine, mais tout ça à la fois dans un désordre
    magnifique.
    La lumière y est d'une crudité rare. Pas la lumière dorée de Marrakech, mais une
    lumière blanche et directe qui ne pardonne rien. Les contrastes sont immédiats,
    les ombres presque noires à midi, les façades brûlées.
    J'ai cherché à photographier la tension entre une ville qui se modernise à toute
    vitesse et une vie de quartier qui n'a pas changé. Les deux coexistent à un mètre
    l'un de l'autre, sans se voir.

