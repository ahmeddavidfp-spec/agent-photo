# --- Contexte curatorial par galerie (pass 2) --------------------------------
# Texte long décrivant TA vision artistique de la ville. Injecté dans Pass 2
# UNIQUEMENT si la galerie courante est présente — l'IA l'utilise pour capter
# le mood/thème, sans le copier. Laisse vide ou omets une galerie pour utiliser
# uniquement voice_examples.
gallery_context:
  new-york: |
    New York est un assaut permanent sur les sens. C'est la ville de la photographie
    de rue par excellence, celle où chaque angle est une icône potentielle. Pour
    cette série, j'ai dû filtrer ce trop-plein pour trouver mon propre chemin à
    travers la verticalité écrasante et le bruit incessant. C'est un travail sur
    l'énergie pure.
    À Manhattan, la lumière descend comme une lame entre les gratte-ciels, créant
    des contrastes d'une violence magnifique. J'ai utilisé ces puits de clarté
    pour isoler des individus au milieu de la foule anonyme. Photographier New York,
    c'est traquer ces instants de solitude absolue au cœur du chaos le plus total.
    Rien n'est jamais figé ici. Les taxis jaunes, les vapeurs de métro et les flux
    de piétons créent une chorégraphie nerveuse. Mes images tentent de restituer
    cette vitesse, tout en cherchant des points de fixation : un regard, une main
    posée sur un journal, un visage éclairé par un reflet. C'est une quête de
    l'humain dans la démesure.

  tokyo: |
    Je n'ai pas photographié Tokyo, c'est elle qui m'a traversé. Je suis arrivé
    avec mes repères et ils ont disparu. Rien ici ne se donne comme ailleurs :
    tout est fluide, précis et discret. Pourtant, Tokyo déborde de formes et de
    tensions douces. C'est une ville qui demande un respect immense du cadre et
    du silence.
    Dans cette ville, il n'y a pas de cri, mais une intensité rare. Chaque
    mouvement semble pensé, chaque espace est habité avec une retenue fascinante.
    J'ai photographié avec curiosité et gratitude, cherchant à traduire mon
    propre vertige face à une organisation urbaine que je ne comprenais pas,
    mais que je sentais profondément vivante.
    Tokyo est faite de contrastes invisibles. Rien ne déborde, et pourtant tout
    est en mouvement perpétuel. Dans mes photos, on trouve cette tension : des
    corps isolés dans la foule, des reflets fragmentés et des gestes calmes au
    cœur du tumulte.

  milan: |
    Milan est une ville de mouvement et d'allure. Tout y semble habité par une
    forme d'élégance naturelle, des façades majestueuses aux passants pressés.
    J'ai voulu saisir cette énergie particulière, ce mélange de tradition
    bourgeoise et de modernité nerveuse qui définit l'identité milanaise. Ici,
    la rue est une scène permanente.
    Dans les galeries couvertes comme dans les quartiers plus populaires, le
    regard est sans cesse sollicité par des contrastes visuels forts. J'ai
    photographié la lumière qui tombe à pic sur les pavés, les silhouettes qui
    se découpent avec précision et l'esthétique soignée de chaque coin de rue.
    Milan réussit à faire cohabiter le faste et l'austérité. Mes images
    explorent cette dualité : la verticalité des gratte-ciels de Porta Nuova
    face à la pierre grise des vieux palais.

